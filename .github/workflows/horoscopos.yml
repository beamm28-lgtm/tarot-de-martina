name: Actualizar horoscopos diarios

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar web
        uses: actions/checkout@v4

      - name: Preparar fecha
        run: date -u

      - name: Guardar cambios
        run: echo "Actualizacion diaria preparada"
